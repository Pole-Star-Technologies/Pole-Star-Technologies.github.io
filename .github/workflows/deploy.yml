name: Deploy public site

# GitHub Pages is the host, and the pipeline is the build in this repo: the
# build refuses to write dist/ while a config value is TODO or a {{token}} is
# unresolved, so a half-filled policy page cannot reach the URL the Play
# Console points at.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate (no writes)
        run: node build.mjs --check

      - name: Build dist/
        run: node build.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
